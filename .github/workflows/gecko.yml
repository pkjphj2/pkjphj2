name: gecko

on:
  schedule:
    - cron: "0 15 * * *"  # 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gecko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/cards.py gecko
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/gecko.svg assets/gecko-dark.svg
          git diff --cached --quiet || (git commit -m "Update gecko" && git push)
